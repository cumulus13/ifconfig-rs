[package]
name = "ifconfig-rs"
version = "1.0.12"
edition = "2021"

[[bin]]
name = "ifconfig"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
winreg = "0.52"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_UI_Shell",
]